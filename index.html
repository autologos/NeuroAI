		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};

<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

##### Why philosophy? Because when we reach the outer edges of scientific knowledge, all that is left are philosophical (mathematical)`$^1$` questions.

And, main question for much of cog-neuro + AI = 

### what is intelligence? 

##### `$^1$` These two are highly interrelated and conceptually difficult to differentiate, remind me to return to this if you are interested in hearing more.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

##### Asking _what_ (and why) is often unsuitable for approaching complex concepts, because they are context-dependent, subject to many interacting constraints, etc. Our intuition for “what” seems to be based on the fact that we’re creatures with pretty prominent object-permanence proclivities, we like to point to things, and have things pointed out.`$^1$` But where to _point_ to when we ask what intelligence is? It’s a dynamic, multifaceted phenomenon... and there are many instantiations, approaches, etc. 

#### _How_ is often more hypothesis-friendly and scientific.

##### `$^1$` You see? I am (at)tempted to answer a “what/why” question here.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

It’s similar to asking what maths is, and: 
##### Maths, like recipes, has both ingredients and method ... we can’t understand [it] unless we talk about the _way it is done_. [Just like with intelligence]. ... It’s a bit of a chicken-and-egg question [because] maths is defined by the techniques [i.e., the *how*] it uses to study things [i.e., the *what*], and that the things it studies are determined by those techniques.

Eugenia Cheng, _Cakes, Custard and Category Theory_, 2015, p. 10.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

#### Likewise, intelligence can be understood as the various ways (the _how_) intelligent creatures display/perform/plan/etc. behavior (the _what_), which they recognize`$^1$` as intelligent because because they themselves possess (and evolve) that capacity.

##### `$^1$` Please pay close attention to the word *re-cognize* here: it is not only a sign of recursivity in the mind, but particularly: in distributed, dialogical (intelligent) creatures!
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

The BZ chemical reaction is a great example because as Juarrero notes: “more so than physical convection cells, hyperloop-creating constraints revive the specter of self-cause, the [bane] of Western philosophy and science.” Autopoiesis.

“The two autocatalytic cycles in the BZ reaction intertwine to self-produce a set of mereological constraints. The hypercycle as a whole stabilizes and governs its individual reactions (including the locally autocatalytic fourth step) which, when combined, enable the hypercyle in the first place. This recursive and Escher-like “strange loop” (Hofstadter 1979) makes BZ hyper-cycles exemplars of Kant’s self-organizing self-cause—“a form of causality unknown to us” (Juarrero-Roque 1985).” (p. 91).
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

As Mario (who also looks at the BZ reaction) points out: “ The meaning of the mechanism analogy in the study of organisms and brain function has to be put under adequate light to be serviceable.” (v, preface to _Invariants of behavior_, 2009).

What constraint-focused rather than local/building-block-focused approaches can give us is attention to what adequate light is: the word “gol” is not an energy-carrying phenomenon per se, but can be understood to have tremendous potential energy in the right context (a footbal stadium, for example).
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

##### Philosophy sets the frame wide enough to reconsider our concepts, and how we are or are not asking the right questions:

Emily Sullivan (Utrecht)

##### “Idealizations, deliberate distortions introduced into scientific theories and models, are commonplace in science. ... How could a  deliberately false claim or representation lead to the epistemic successes of science? In answering this question philosophers have been single-focused on explaining how and why idealizations are successful.  But surely some idealizations fail. [Proposal:] if we **ask a slightly different question**, whether a particular idealization is successful, then that not only gives insight into idealization failure, but will make us realize that our theories of idealization need revision. [Porposal] [re]consider idealizations in physics, computation, and machine learning.”
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

Finding the right questions to ask (i.e., coming up with hypotheses) is the hardest thing.

What are questions? And are they different from hypotheses?
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

##### Ned Markosian, “The Paradox of the Question”, Analysis 57.2, 1997.

“What is the best question...?”
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### So far... so good?

Philosophy can help elucidate **category errors**, i.e., confusing a type of explanation (as measurement, mechanism, model, history, etc.) for another (about reality, meaning, cause, essence, etc.). 

Science provides the ways in which we chunk reality (the data + the methods); and philosophy can provide clarification (or questions about) the _taxonomy of explanations_.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

##### Common scientific fallacies that require philosophy:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Naturalistic** (turning is into ought, e.g., because evolved = good);
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Reification** (misplaced concreteness; turning maps into territories, e.g., IQ);
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Measurement** (if it can’t be measured: does not exist, e.g., self (as a center of narrative gravity));
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Ahistoricism** (or _presentist_ bias: what we know today applies across time);
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Efficient **cause** or mechanistic **reductionism** (singling out one element as main cause; “love is just hormones”: yes, but... many moving parts! E.g., constraints (Juarrero));
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Important methodological consequences of differences between **_epistemology_** (how we know something) and **_ontology_** (what it actually is).

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

The aim of science is to seek the simplest explanations of complex facts. We are apt to fall into the error of thinking that the facts are simple because simplicity is the goal of our quest. The guiding motto in the life of every natural philosopher should be, “Seek simplicity and distrust it.” 

A. N. Whitehead, _The Concept of Nature_ (1919), Chapter VII, p.143.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Falsifiability and thinking about other minds/models/etc. like Carroll thinks about the multiverse:

<img src="sean carroll multiverse falsifiability.png" alt="" style="width: 500px; object-fit: fill">
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

>It is natural ... for scientists to wonder what the universe is like beyond our observable part of it.
>
>... [but] **there has been a backlash** ... what happens outside the universe we can possibly observe simply shouldn’t  _matter_  ... The job of science, in this view, is to account for what we observe, not to speculate about what we don’t. There is a real worry that the multiverse represents imagination allowed to roam unfettered from empirical observation, unable to be tested by conventional means.

p. 2.

Is this the same case for all speculation? For thinking about other minds? For ...?
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

>In its strongest from, the objection argues that the very idea of an unobservable multiverse shouldn’t count as science at all, often appealing to Karl Popper’s dictum that a theory should be falsiﬁable to be considered scientiﬁc. At the same time, proponents of the multiverse (and its partner in crime, the anthropic principle) will sometimes argue that while multiverse cosmologies are deﬁnitely part of science, they represent a new  _kind_  of science, “a deep change of paradigm that revolutionizes our understanding of nature and opens new ﬁelds of possible scientiﬁc thought”.

ibid.

Speaking of a new kind of science: we could also consider Wolfram’s thoughts on interconcept space here. Basically coming down to the idea that everything that is not prohibited is possible (source).
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

>The point is not that we are changing the nature of science by allowing unfalsifiable hypotheses into our purview. The point is that “falsifiability” was never the way that scientific theories were judged (although scientists have often talked as if it were). While the multiverse is a standard scientific hypothesis, it does highlight interesting and nontrivial issues in the methodology and epistemology of science. The best outcome of current controversies over the multiverse and related ideas (other than the hopeful prospect of finding the correct description of nature) is if working scientists are nudged toward accepting a somewhat more nuanced and accurate picture of scientific practice.

p. 3.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

>Science proceeds via an ongoing dialogue between theory and experiment, searching for the best possible understanding, rather than cleanly lopping off falsiﬁed theories one by one.

p. 4.

As Carroll (and most philosophers of science note): falsifiability (and a lot of Popper) is just out the window.

What then? Is all science... philosophy?
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

What we should keep from the concept of falsifiability (according to Carroll):

•  **Deﬁniteness**.  A good scientiﬁc theory says something speciﬁc and inﬂexible about how nature works.  It shouldn’t be possible to take any conceivable set of facts and claim that they are compatible with the theory.

•  **Empiricism**.  The ultimate purpose of a theory is to account for what we observe. No theory should be judged to be correct solely on the basis of its beauty or reasonableness or other qualities that can be established without getting out of our armchairs and looking at the world.

p. 4.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

>...there is a crucial difference between “makes a speciﬁc prediction, but one we can’t observe” and “has no explanatory impact on what we do observe.” Even if [another mind, Carroll says: the multiverse] itself is unobservable, its existence may well change how we account for features of the [mind, he says universe] we _can_ observe.

p. 5.

How does this compare?
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
